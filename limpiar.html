<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Actualizando Más Música…</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0d1b2f; color: #fff;
         text-align: center; padding: 48px 24px; margin: 0; }
  h2 { margin: 0 0 8px; }
  #msg { color: #b9c4d6; }
  button { margin-top: 20px; padding: 12px 20px; border: 0; border-radius: 10px;
           background: #00a038; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .ok { color: #38d66a; }
</style>
</head>
<body>
  <h2>Actualizando Más Música…</h2>
  <p id="msg">Borrando la versión vieja guardada en este dispositivo…</p>
  <button id="ir" hidden onclick="location.replace('/?v=' + Date.now())">Ir a la app</button>
<script>
(async function () {
  const msg = document.getElementById('msg');
  const ir = document.getElementById('ir');
  try {
    /* 1) Sacar los service workers (los que "secuestran" la app vieja) */
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) { try { await r.unregister(); } catch (e) {} }
      msg.textContent = 'Service workers eliminados…';
    }
    /* 2) Borrar todas las cachés guardadas */
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch (e) {} }
      msg.textContent = 'Caché borrada…';
    }
    /* 3) Limpiar el caché HTTP cuando el navegador lo permite */
    if (window.indexedDB && indexedDB.databases) {
      try {
        const dbs = await indexedDB.databases();
        for (const d of dbs) { if (d.name) indexedDB.deleteDatabase(d.name); }
      } catch (e) {}
    }
    msg.innerHTML = '<span class="ok">¡Listo!</span> Volviendo a la app actualizada…';
    ir.hidden = false;
    setTimeout(function () { location.replace('/?v=' + Date.now()); }, 1500);
  } catch (e) {
    msg.textContent = 'Error: ' + e.message;
    ir.hidden = false;
  }
})();
</script>
</body>
</html>
